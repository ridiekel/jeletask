variables:
  # Maven repository and wrapper distribution live on the runner's persistent /cache volume
  MAVEN_USER_HOME: "/cache/.m2"
  MAVEN_OPTS: "-Dhttps.protocols=TLSv1.2 -Dmaven.repo.local=/cache/.m2/repository -Dorg.slf4j.simpleLogger.showDateTime=true -Djava.awt.headless=true"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version -DinstallAtEnd=true -DdeployAtEnd=true -Dstyle.color=always"
  TELETASK_TEST_TEMPDIR: "/cache/jeletask"
  DOCKERHUB_IMAGE: "ridiekel/jeletask2mqtt"
  TERM: xterm-256color
  # arm64 images are built on the amd64 runner under QEMU emulation (no arm64 runner needed)
  BINFMT_IMAGE: "tonistiigi/binfmt:qemu-v10.2.3"

default:
  tags:
    - ridiekel

.any-runner:
  inherit:
    default: false

stages:
  - test
  - visualize
  - confirm
  - native-test
  - release
  - images
  - publish

test-jvm:
  stage: test
  tags:
    - docker-host
  image: ridiekel/base-test:latest
  script:
    - |
      echo "Running JVM tests..."
      ./mvnw $MAVEN_CLI_OPTS org.jacoco:jacoco-maven-plugin:prepare-agent verify org.jacoco:jacoco-maven-plugin:report
      cat target/site/jacoco/index.html | grep -o 'Total[^%]*%' | sed 's/<.*>/ /; s/Total/Jacoco Coverage Total:/'
  coverage: '/Total.*?([0-9]{1,3})%/'
  artifacts:
    reports:
      junit: 
        - target/surefire-reports/TEST-*.xml
        - target/failsafe-reports/TEST-*.xml
    paths:
      - ./target/classes/*
      - ./target/site/jacoco/*
  rules:
    - if: $CI_COMMIT_TITLE !~ /^\[maven-release-plugin\].*/
      when: always

sonarqube-analysis:
  extends: .any-runner
  image: ridiekel/base-test:latest
  stage: visualize
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  needs: ["test-jvm"]
  before_script:
    - source "${SDKMAN_DIR}/bin/sdkman-init.sh"
  script:
    - ./mvnw $MAVEN_CLI_OPTS sonar:sonar -Dmaven.test.failure.ignore=true
  allow_failure: true
  rules:
    - if: $CI_COMMIT_TITLE !~ /^\[maven-release-plugin\].*/
      when: always

code-coverage-report-conversion:
  extends: .any-runner
  stage: visualize
  image: registry.gitlab.com/haynes/jacoco2cobertura:1.0.11
  script:
    - python /opt/cover2cover.py target/site/jacoco/jacoco.xml $CI_PROJECT_DIR/src/main/java/ > target/site/cobertura.xml
  needs: ["test-jvm"]
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: target/site/cobertura.xml
  rules:
    - if: $CI_COMMIT_TITLE !~ /^\[maven-release-plugin\].*/
      when: always

# Starting this job is the confirmation to release: the native tests run and, once
# they pass, the release, the images and their publication follow automatically.
# It is a separate job because a manual job must allow failure to not block the
# pipeline, and an allowed failure of the native tests would not stop the release.
confirm-release:
  extends: .any-runner
  stage: confirm
  image: alpine:latest
  needs: ["test-jvm"]
  variables:
    GIT_STRATEGY: none
  script:
    - echo "Release confirmed, continuing with the native tests and the release"
  rules:
    - if: $CI_COMMIT_BRANCH == 'master' && $CI_COMMIT_TITLE !~ /^\[maven-release-plugin\].*/
      when: manual
      allow_failure: true

test-native:
  stage: native-test
  image: ridiekel/base-test:latest
  needs: ["confirm-release"]
  script:
    - |
      echo "Running native amd64 tests..."
      ./mvnw $MAVEN_CLI_OPTS -PnativeTest verify
  artifacts:
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml
        - target/failsafe-reports/TEST-*.xml
  rules:
    - if: $CI_COMMIT_BRANCH == 'master' && $CI_COMMIT_TITLE !~ /^\[maven-release-plugin\].*/
      when: on_success
      allow_failure: false

create-release:
  stage: release
  image: ridiekel/base-test:latest
  needs: ["test-native"]
  before_script:
    - |
      echo "Configuring..."
      echo "Email: $GITLAB_CI_EMAIL"
      echo "URL: $GITLAB_CI_URL"
      git config --global user.email "$GITLAB_CI_EMAIL"
      git config --global user.name "GitLab CI"
      git config --global url."$GITLAB_CI_URL".insteadOf "git@github.com:ridiekel/"
      which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )
      eval $(ssh-agent -s)
      ssh-add <(echo "$GITLAB_CI_SSH_PRIVATE_KEY")
      mkdir -p ~/.ssh
      [[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
      git checkout -B "$CI_COMMIT_REF_NAME"
      echo $CI_JOB_ID
      echo GE_JOB_ID=$CI_JOB_ID >> variables.env
  script:
    - |
      ./mvnw -Darguments="-Dmaven.javadoc.skip=true -DskipTests=true" release:clean release:prepare -B
      cat release.properties | sed 's/^scm\./scm_/g' | grep scm_ >> variables.env
      cat variables.env
      ./mvnw -Darguments="-Dmaven.javadoc.skip=true -DskipTests=true" release:perform -B
  artifacts:
    paths:
      - target/jeletask*.jar
      - release.properties
      - variables.env
      - Dockerfile
    reports:
      dotenv: variables.env
  rules:
    - if: $CI_COMMIT_BRANCH == 'master' && $CI_COMMIT_TITLE !~ /^\[maven-release-plugin\].*/
      when: on_success
      allow_failure: false

create-gitlab-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - |
      echo 'running release_job'
      echo 'Previous Job ID is printed below'
      echo ${GE_JOB_ID}
      echo ${scm_tag}
  needs:
    - job: create-release
      artifacts: true
  release:
    name: 'Release ${scm_tag}'
    description: 'Created using the release-cli'
    tag_name: '${scm_tag}'
  rules:
    - if: $CI_COMMIT_BRANCH == 'master' && $CI_COMMIT_TITLE !~ /^\[maven-release-plugin\].*/
      when: on_success
      allow_failure: false

release-upload:
  stage: release
  image: alpine:latest
  needs:
    - job: create-release
      artifacts: true
    - job: create-gitlab-release
      artifacts: false
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      set -euo pipefail
      echo "scm_tag=${scm_tag:-}"
      TAG="${scm_tag:-${CI_COMMIT_TAG:-}}"
      if [ -z "$TAG" ]; then
      echo "Tag niet gevonden (scm_tag of CI_COMMIT_TAG)";
      echo "Beschikbare bestanden:"; ls -la;
      exit 1;
      fi
      echo $TAG
      VERSION="${TAG#${CI_PROJECT_NAME}-}"
      echo "$VERSION"
      JAR="target/${CI_PROJECT_NAME}-${VERSION}.jar"
      [ -f "$JAR" ] || JAR="$(ls -1 target/*.jar | head -n1)"
      test -f "$JAR" || { echo "Geen JAR gevonden in target/"; exit 1; }
      ls -al $JAR
      UPLOAD_JSON="$(curl -sS -f -H "PRIVATE-TOKEN: ${GITLAB_TOKEN}" -F "file=@${JAR}" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/uploads")"
      echo $UPLOAD_JSON
      FILE_URL="${CI_SERVER_URL}$(echo "$UPLOAD_JSON" | jq -r .full_path)"
      echo $FILE_URL
      ENC_TAG="$(printf %s "$TAG" | jq -sRr @uri)"
      echo $ENC_TAG
      curl -sS --fail-with-body -X POST -H "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
        --data-urlencode "name=$(basename "$JAR")" \
        --data-urlencode "url=${FILE_URL}" \
        --data-urlencode "link_type=package" \
        --data-urlencode "filepath=/$(basename "$JAR")" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/${ENC_TAG}/assets/links"
  rules:
    - if: $CI_COMMIT_BRANCH == 'master' && $CI_COMMIT_TITLE !~ /^\[maven-release-plugin\].*/
      when: on_success
      allow_failure: false

.build-image:
  stage: images
  resource_group: docker-image-build
  needs:
    - job: create-release
      artifacts: true
    - job: create-gitlab-release
      artifacts: false
    - job: release-upload
      artifacts: false
  rules:
    - if: $CI_COMMIT_BRANCH == 'master' && $CI_COMMIT_TITLE !~ /^\[maven-release-plugin\].*/
      when: on_success
      allow_failure: false

.build-image-jvm:
  extends: .build-image
  image: docker:latest
  before_script:
    - apk add --no-cache bash

.build-image-native:
  extends: .build-image
  image: ridiekel/base-test:latest

build-image-jvm-amd64:
  extends: .build-image-jvm
  script:
    - ci/build-image.sh jvm amd64

build-image-jvm-arm64:
  extends: .build-image-jvm
  script:
    - ci/build-image.sh jvm arm64

build-image-native-amd64:
  extends: .build-image-native
  script:
    - ci/build-image.sh native amd64

build-image-native-arm64:
  extends: .build-image-native
  script:
    - ci/build-image.sh native arm64

publish-images:
  stage: publish
  image: docker:latest
  resource_group: docker-image-build
  needs:
    - job: create-release
      artifacts: true
    - job: build-image-jvm-amd64
    - job: build-image-jvm-arm64
    - job: build-image-native-amd64
    - job: build-image-native-arm64
  script:
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
    - ci/publish-images.sh
  rules:
    - if: $CI_COMMIT_BRANCH == 'master' && $CI_COMMIT_TITLE !~ /^\[maven-release-plugin\].*/
      when: on_success
      allow_failure: false
