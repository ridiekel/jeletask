variables:
  # Maven repository and wrapper distribution live on the runner's persistent /cache volume
  MAVEN_USER_HOME: "/cache/.m2"
  MAVEN_OPTS: "-Dhttps.protocols=TLSv1.2 -Dmaven.repo.local=/cache/.m2/repository -Dorg.slf4j.simpleLogger.showDateTime=true -Djava.awt.headless=true"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version -DinstallAtEnd=true -DdeployAtEnd=true -Dstyle.color=always"
  TELETASK_TEST_TEMPDIR: "/cache/jeletask"
  DOCKERHUB_IMAGE: "ridiekel/jeletask2mqtt"
  TERM: xterm-256color
  # arm64 builds run on the amd64 runner under QEMU emulation (no arm64 runner needed)
  GRAALVM_ARM64_IMAGE: "ghcr.io/graalvm/native-image-community:25i4-25.0.4.1.1"
  BINFMT_IMAGE: "tonistiigi/binfmt:qemu-v10.2.3"

stages:
  - test
  - visualize
  - prerelease
  - release

test-job-amd64:
  stage: test
  image: ridiekel/base-test:latest
  tags:
    - docker-host
  script:
    - |
      echo "Running native amd64 tests..."
      ./mvnw $MAVEN_CLI_OPTS -PnativeTest org.jacoco:jacoco-maven-plugin:prepare-agent verify org.jacoco:jacoco-maven-plugin:report
      cat target/site/jacoco/index.html | grep -o 'Total[^%]*%' | sed 's/<.*>/ /; s/Total/Jacoco Coverage Total:/'
  coverage: '/Total.*?([0-9]{1,3})%/'
  artifacts:
    reports:
      junit: 
        - target/surefire-reports/TEST-*.xml
        - target/failsafe-reports/TEST-*.xml
    paths:
      - ./target/classes/*
      - ./target/site/jacoco/*
  rules:
    - if: $CI_COMMIT_TITLE !~ /^\[maven-release-plugin\].*/
      when: always

test-job-arm64:
  stage: prerelease
  image: ridiekel/base-test:latest
  tags:
    - docker-host
  timeout: 3h
  script:
    - |
      echo "Registering QEMU emulation for arm64..."
      docker run --privileged --rm "${BINFMT_IMAGE}" --install arm64
      echo "Running native arm64 tests under emulation..."
      CID=$(docker create --platform linux/arm64 \
        -v /var/run/docker.sock:/var/run/docker.sock \
        -v jeletask-m2-arm64:/m2 \
        -e LANG=C.UTF-8 -e LC_ALL=C.UTF-8 -e MAVEN_USER_HOME=/m2 \
        --network host -e TESTCONTAINERS_HOST_OVERRIDE=localhost \
        -w /src --entrypoint bash "${GRAALVM_ARM64_IMAGE}" \
        -c "microdnf install -y unzip findutils > /dev/null && ./mvnw $MAVEN_CLI_OPTS -Dmaven.repo.local=/m2/repository -PnativeTest verify")
      docker cp "${CI_PROJECT_DIR}/." "${CID}:/src"
      EXIT_CODE=0
      docker start -a "${CID}" || EXIT_CODE=$?
      mkdir -p target
      docker cp "${CID}:/src/target/." target/ || true
      docker rm -f "${CID}"
      exit ${EXIT_CODE}
  artifacts:
    when: always
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml
        - target/failsafe-reports/TEST-*.xml
  rules:
    - if: $CI_COMMIT_BRANCH == 'master' && $CI_COMMIT_TITLE !~ /^\[maven-release-plugin\]prepare release.*/
      when: manual
      allow_failure: true

sonarqube-analysis:
  image: ridiekel/base-test:latest
  stage: visualize
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  needs: ["test-job-amd64"]
  before_script:
    - source "${SDKMAN_DIR}/bin/sdkman-init.sh"
  script:
    - ./mvnw $MAVEN_CLI_OPTS sonar:sonar -Dmaven.test.failure.ignore=true
  allow_failure: true
  rules:
    - if: $CI_COMMIT_TITLE !~ /^\[maven-release-plugin\].*/
      when: always

code-coverage-report-conversion:
  stage: visualize
  image: registry.gitlab.com/haynes/jacoco2cobertura:1.0.11
  script:
    - python /opt/cover2cover.py target/site/jacoco/jacoco.xml $CI_PROJECT_DIR/src/main/java/ > target/site/cobertura.xml
  needs: ["test-job-amd64"]
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: target/site/cobertura.xml
  rules:
    - if: $CI_COMMIT_TITLE !~ /^\[maven-release-plugin\].*/
      when: always

create-release:
  stage: release
  image: ridiekel/base-test:latest
  needs:
    - job: test-job-arm64
      artifacts: true
  before_script:
    - |
      echo "Configuring..."
      echo "Email: $GITLAB_CI_EMAIL"
      echo "URL: $GITLAB_CI_URL"
      git config --global user.email "$GITLAB_CI_EMAIL"
      git config --global user.name "GitLab CI"
      git config --global url."$GITLAB_CI_URL".insteadOf "git@github.com:ridiekel/"
      which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )
      eval $(ssh-agent -s)
      ssh-add <(echo "$GITLAB_CI_SSH_PRIVATE_KEY")
      mkdir -p ~/.ssh
      [[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
      git checkout -B "$CI_COMMIT_REF_NAME"
      echo $CI_JOB_ID
      echo GE_JOB_ID=$CI_JOB_ID >> variables.env
  script:
    - |
      ./mvnw -Darguments="-Dmaven.javadoc.skip=true -DskipTests=true" release:clean release:prepare -B
      cat release.properties | sed 's/^scm\./scm_/g' | grep scm_ >> variables.env
      cat variables.env
      ./mvnw -Darguments="-Dmaven.javadoc.skip=true -DskipTests=true" release:perform -B
  artifacts:
    paths:
      - target/jeletask*.jar
      - release.properties
      - variables.env
      - Dockerfile
    reports:
      dotenv: variables.env
  rules:
    - if: $CI_COMMIT_BRANCH == 'master' && $CI_COMMIT_TITLE !~ /^\[maven-release-plugin\]prepare release.*/
      when: on_success
      allow_failure: true

create-gitlab-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - |
      echo 'running release_job'
      echo 'Previous Job ID is printed below'
      echo ${GE_JOB_ID}
      echo ${scm_tag}
  needs:
    - job: create-release
      artifacts: true
  release:
    name: 'Release ${scm_tag}'
    description: 'Created using the release-cli'
    tag_name: '${scm_tag}'
  rules:
    - if: $CI_COMMIT_BRANCH == 'master' && $CI_COMMIT_TITLE !~ /^\[maven-release-plugin\].*/
      when: on_success
      allow_failure: false

release-upload:
  stage: release
  image: alpine:latest
  needs:
    - job: create-release
      artifacts: true
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      set -euo pipefail
      echo "scm_tag=${scm_tag:-}"
      TAG="${scm_tag:-${CI_COMMIT_TAG:-}}"
      if [ -z "$TAG" ]; then
      echo "Tag niet gevonden (scm_tag of CI_COMMIT_TAG)";
      echo "Beschikbare bestanden:"; ls -la;
      exit 1;
      fi
      echo $TAG
      VERSION="${TAG#${CI_PROJECT_NAME}-}"
      echo "$VERSION"
      JAR="target/${CI_PROJECT_NAME}-${VERSION}.jar"
      [ -f "$JAR" ] || JAR="$(ls -1 target/*.jar | head -n1)"
      test -f "$JAR" || { echo "Geen JAR gevonden in target/"; exit 1; }
      ls -al $JAR
      UPLOAD_JSON="$(curl -sS -f -H "PRIVATE-TOKEN: ${GITLAB_TOKEN}" -F "file=@${JAR}" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/uploads")"
      echo $UPLOAD_JSON
      FILE_URL="${CI_SERVER_URL}$(echo "$UPLOAD_JSON" | jq -r .full_path)"
      echo $FILE_URL
      ENC_TAG="$(printf %s "$TAG" | jq -sRr @uri)"
      echo $ENC_TAG
      curl -sS --fail-with-body -X POST -H "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
        --data-urlencode "name=$(basename "$JAR")" \
        --data-urlencode "url=${FILE_URL}" \
        --data-urlencode "link_type=package" \
        --data-urlencode "filepath=/$(basename "$JAR")" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/${ENC_TAG}/assets/links"
  rules:
    - if: $CI_COMMIT_BRANCH == 'master' && $CI_COMMIT_TITLE !~ /^\[maven-release-plugin\].*/
      when: on_success
      allow_failure: false

docker-build-and-push:
  stage: release
  image: docker:latest
  tags:
    - docker-host
  services:
    - name: docker:dind
      command: ["--experimental"]
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  needs:
    - job: create-release
      artifacts: true
  before_script:
    - |
      apk add --no-cache bash curl jq
      echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      docker run --privileged --rm tonistiigi/binfmt --install all
      docker buildx create --use --name multiarch
      docker buildx inspect --bootstrap
  script:
    - |
      set -euo pipefail
      TAG="${scm_tag:-${CI_COMMIT_TAG:-}}"
      test -n "$TAG" || { echo "Could not find tag (scm_tag/CI_COMMIT_TAG)"; exit 1; }
      VERSION="${TAG#${CI_PROJECT_NAME}-}"
      echo "TAG=$TAG VERSION=$VERSION"
      IMAGE="${DOCKERHUB_IMAGE:-${DOCKERHUB_USERNAME}/${CI_PROJECT_NAME}}"
      echo "IMAGE=$IMAGE"
      docker buildx build --platform linux/amd64,linux/arm64 -t "$IMAGE:latest" -t "$IMAGE:$VERSION" --push .
  rules:
    - if: $CI_COMMIT_BRANCH == 'master' && $CI_COMMIT_TITLE !~ /^\[maven-release-plugin\].*/
      when: on_success
      allow_failure: false

docker-build-and-push-native-arm64:
  stage: release
  image: ridiekel/base-test:latest
  tags:
    - docker-host
  timeout: 3h
  needs:
    - job: create-release
      artifacts: true
    - job: test-job-arm64
      artifacts: true
  script:
    - |
      set -euo pipefail
      IMAGE="${DOCKERHUB_IMAGE:-${DOCKERHUB_USERNAME}/${CI_PROJECT_NAME}}"
      TAG="${scm_tag:-${CI_COMMIT_TAG:-}}"
      test -n "$TAG" || { echo "Could not find tag (scm_tag/CI_COMMIT_TAG)"; exit 1; }
      VERSION="${TAG#${CI_PROJECT_NAME}-}"
      echo "Version is: ${VERSION}"
      IMAGE_VERSIONED="${IMAGE}:${VERSION}-native-arm64"
      IMAGE_LATEST="${IMAGE}:latest-native-arm64"
      echo "Versioned image name is: ${IMAGE_VERSIONED}"
      echo "Latest image name is: ${IMAGE_LATEST}"
      echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      echo "Registering QEMU emulation for arm64..."
      docker run --privileged --rm "${BINFMT_IMAGE}" --install arm64
      echo "Running native arm64 build under emulation..."
      ./mvnw $MAVEN_CLI_OPTS -Pnative -DskipTests spring-boot:build-image \
        -Dspring-boot.build-image.imageName="${IMAGE_VERSIONED}" \
        -Dspring-boot.build-image.imagePlatform=linux/arm64 \
        -Dspring-boot.build-image.environment.BP_NATIVE_IMAGE_BUILD_ARGUMENTS="-march=compatibility" \
        -Dbuild-image.cache-name="${CI_PROJECT_NAME}-native-arm64"
      echo "Tag latest"
      docker tag "${IMAGE_VERSIONED}" "${IMAGE_LATEST}"
      echo "Push both tags"
      docker push "${IMAGE_VERSIONED}"
      docker push "${IMAGE_LATEST}"
  rules:
    - if: $CI_COMMIT_BRANCH == 'master' && $CI_COMMIT_TITLE !~ /^\[maven-release-plugin\].*/
      when: on_success
      allow_failure: false

.release-native-amd64-template:
  stage: release
  image: ridiekel/base-test:latest
  tags:
    - docker-host
  needs:
    - job: create-release
      artifacts: true
  variables:
    VERSION_SUFFIX: ""              
    PUSH_GENERIC_LATEST: "false"  
  rules:
    - if: $CI_COMMIT_BRANCH == 'master' && $CI_COMMIT_TITLE !~ /^\[maven-release-plugin\].*/
      when: on_success
      allow_failure: false
  script:
    - |
      set -x
      
      export BP_NATIVE_IMAGE_BUILD_ARGUMENTS="-march=x86-64${VERSION_SUFFIX}"

      IMAGE="${DOCKERHUB_IMAGE:-${DOCKERHUB_USERNAME}/${CI_PROJECT_NAME}}"
      TAG="${scm_tag:-${CI_COMMIT_TAG:-}}"
      test -n "$TAG" || { echo "Could not find tag (scm_tag/CI_COMMIT_TAG)"; exit 1; }

      VERSION="${TAG#${CI_PROJECT_NAME}-}"
      echo "Version is: ${VERSION}"

      IMAGE_VERSIONED="${IMAGE}:${VERSION}-native-amd64${VERSION_SUFFIX}"
      IMAGE_LATEST="${IMAGE}:latest-native-amd64${VERSION_SUFFIX}"

      echo "Versioned image name is: ${IMAGE_VERSIONED}"
      echo "Latest image name is: ${IMAGE_LATEST}"

      echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      echo "Running native amd64 build..."
      echo "Architecture: ${BP_NATIVE_IMAGE_BUILD_ARGUMENTS}"

      ./mvnw $MAVEN_CLI_OPTS -Pnative -Dnative-image.args="${BP_NATIVE_IMAGE_BUILD_ARGUMENTS}" \
        -DskipTests \
        spring-boot:build-image \
        -Dspring-boot.build-image.imageName="${IMAGE_VERSIONED}" \
        -Dspring-boot.build-image.environment.BP_NATIVE_IMAGE_BUILD_ARGUMENTS="${BP_NATIVE_IMAGE_BUILD_ARGUMENTS}" \
        -Dbuild-image.cache-name="${CI_PROJECT_NAME}-native-amd64${VERSION_SUFFIX}"

      docker tag "${IMAGE_VERSIONED}" "${IMAGE_LATEST}"
      docker push "${IMAGE_VERSIONED}"
      docker push "${IMAGE_LATEST}"

      if [ "${PUSH_GENERIC_LATEST}" = "true" ]; then
        echo "Generic image name is: ${IMAGE_VERSIONED}"
        IMAGE_LATEST_NATIVE="${IMAGE}:latest-native-amd64"
        docker tag "${IMAGE_VERSIONED}" "${IMAGE_LATEST_NATIVE}"
        docker push "${IMAGE_LATEST_NATIVE}"
      fi

docker-build-and-push-native-amd64-v1:
  extends: .release-native-amd64-template
  variables:
    VERSION_SUFFIX: "-v1"

docker-build-and-push-native-amd64-v2:
  extends: .release-native-amd64-template
  variables:
    VERSION_SUFFIX: "-v2"

docker-build-and-push-native-amd64-v3:
  extends: .release-native-amd64-template
  variables:
    VERSION_SUFFIX: "-v3"
    PUSH_GENERIC_LATEST: "true"
